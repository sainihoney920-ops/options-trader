
services:
  - type: web
    name: options-trader
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: prod
      - key: PYTHON_EXECUTABLE
        value: ./venv/bin/python3
    autoDeploy: true
